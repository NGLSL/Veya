[package]
name = "veya-desktop"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Veya desktop UI (Iced) — Search + History + Flow"

[[bin]]
name = "veya"
path = "src/main.rs"

[dependencies]
veya-core = { workspace = true }
veya-windows = { workspace = true }
veya-storage = { workspace = true }
iced = { version = "0.13", features = ["tokio", "image", "svg"] }
iced_graphics = "0.13"
fontdb = "0.23"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winres = "0.1"
