[package]
name = "veya-desktop"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Veya desktop UI (Iced) — Search + History + Flow"

[[bin]]
name = "veya"
path = "src/main.rs"

[dependencies]
veya-core = { workspace = true }
veya-windows = { workspace = true }
veya-storage = { workspace = true }
# Like Kite, select the software renderer at build time; do not include wgpu.
iced = { version = "0.13", default-features = false, features = ["tiny-skia", "tokio", "image", "svg", "fira-sans", "auto-detect-theme"] }
iced_graphics = "0.13"
image = { version = "0.25", default-features = false, features = ["png"] }
png = "0.18"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winres = "0.1"

[dev-dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
iced_runtime = "0.13"
tiny-skia = "0.11"
