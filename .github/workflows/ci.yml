name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4.4.0
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal --component rustfmt
          rustup default stable-x86_64-pc-windows-msvc
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test workspace
        shell: pwsh
        run: |
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'veya-appdata'
          New-Item -ItemType Directory -Force -Path $env:APPDATA | Out-Null
          cargo test --locked --workspace
      - name: Check workspace
        run: cargo check --locked --workspace
      - name: Build release binary
        shell: pwsh
        run: |
          cargo build --locked --release -p veya-desktop
          if ($LASTEXITCODE -ne 0) { throw 'cargo release build failed' }
          ./scripts/assert-gui-binary.ps1 -Binary target/release/veya.exe
