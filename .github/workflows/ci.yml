name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4.4.0
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.99.0-x86_64-pc-windows-msvc --profile minimal --component rustfmt
          rustup default 1.99.0-x86_64-pc-windows-msvc
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test workspace
        shell: pwsh
        run: |
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'veya-appdata'
          New-Item -ItemType Directory -Force -Path $env:APPDATA | Out-Null
          cargo test --locked --workspace
      - name: Check workspace
        run: cargo check --locked --workspace
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress
      - name: Build release installer
        shell: pwsh
        run: |
          ./scripts/build-installer.ps1 -Nsis 'C:\Program Files (x86)\NSIS\makensis.exe'
      - name: Verify installation, upgrade and uninstall
        shell: pwsh
        run: ./scripts/test-installer.ps1 -Installer artifacts/veya-setup.exe -Binary target/release-package/release/veya.exe
